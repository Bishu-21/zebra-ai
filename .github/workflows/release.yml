name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt migrations or let a newer release overtake production approval.
concurrency:
  group: zebra-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  staging:
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
  production:
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
