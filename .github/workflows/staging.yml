name: Validate staging

on:
  push:
    branches:
      - codex/release-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep staging on the reviewed revision while a release awaits approval.
  group: zebra-release
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(github.ref, 'refs/heads/codex/')
    uses: ./.github/workflows/ci.yml
  staging:
    needs: checks
    if: vars.STAGING_READY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
