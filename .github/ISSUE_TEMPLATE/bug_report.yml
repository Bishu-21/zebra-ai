name: Bug report
description: Report a reproducible problem in Zebra AI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Zebra AI. Do not include credentials, resumes, personal data, or vulnerability details. Report security issues privately using `SECURITY.md`.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain a security vulnerability or sensitive data.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the deployment, browser and version, operating system, and relevant configuration without secrets.
      placeholder: Local development; Chrome 130; Windows 11
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, or links that help explain the issue.
  - type: dropdown
    id: participation
    attributes:
      label: Are you willing to help fix this?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
