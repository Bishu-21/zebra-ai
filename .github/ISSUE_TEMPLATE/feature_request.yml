name: Feature request
description: Suggest a focused improvement to Zebra AI
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For substantial changes, explain the user problem before proposing an implementation.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what are they unable to do today?
      placeholder: As a job seeker, I need ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior. Implementation ideas are welcome but optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links. Do not include personal data.
